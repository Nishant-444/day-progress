<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Day Progress Tracker</title>
		<style>
			:root {
				--bg: #0c0c0c;
				--text: #e0e0e0;
				--subtle: #888;
				--fill: #34d399;
				--empty: #27272a;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: consolas, sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				margin: 0;
				padding: 20px;
				box-sizing: border-box;
				text-align: center;
				overflow: hidden;
			}
			#a {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 0;
				overflow: hidden;
			}
			.c {
				position: absolute;
				width: 2px;
				height: 2px;
				background: #fff;
				border-radius: 50%;
				box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
			}
			.b {
				width: 3px;
				height: 3px;
				box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
			}
			.s {
				width: 1px;
				height: 1px;
				box-shadow: 0 0 3px rgba(255, 255, 255, 0.5);
			}
			.d {
				max-width: 900px;
				width: 100%;
				position: relative;
				z-index: 1;
			}
			h1 {
				font-size: clamp(2.5rem, 10vw, 6rem);
				font-weight: 600;
				margin: 0;
				letter-spacing: -0.02em;
			}
			p {
				font-size: clamp(1rem, 4vw, 1.25rem);
				color: var(--subtle);
				margin: 0.5rem 0 3rem;
			}
			#b {
				display: grid;
				grid-auto-flow: column;
				grid-template-rows: repeat(4, 1fr);
				gap: 7px;
				width: 100%;
				height: 120px;
			}
			.k {
				background: var(--empty);
				border-radius: 2px;
				transition: background 0.5s;
			}
			.k.l {
				background: var(--fill);
			}
		</style>
	</head>
	<body>
		<div id="a"></div>
		<div class="d">
			<h1 id="p"></h1>
			<p id="t"></p>
			<div id="b"></div>
		</div>
		<script>
			for (i = 0; i < 80; i++) {
				e = document.createElement('div');
				brightness = Math.random();
				if (brightness < 0.2) {
					e.className = 'c b';
					e.style.opacity = Math.random() * 0.3 + 0.7;
				} else if (brightness < 0.6) {
					e.className = 'c';
					e.style.opacity = Math.random() * 0.4 + 0.4;
				} else {
					e.className = 'c s';
					e.style.opacity = Math.random() * 0.3 + 0.2;
				}
				e.style.left = Math.random() * 100 + 'vw';
				e.style.top = Math.random() * 100 + 'vh';
				e.style.animationDelay = Math.random() * 4 + 's';
				a.appendChild(e);
			}
			for (i = 0; i < 100; i++)
				b.appendChild(document.createElement('div')).className = 'k';
			function u() {
				n = new Date();
				s = new Date(n.getFullYear(), n.getMonth(), n.getDate());
				m = n - s;
				r = (m / 864e5) * 100;
				p.textContent = `Today is ${r.toFixed(1)}% complete`;
				l = Math.floor((864e5 - m) / 1e3);
				h = Math.floor(l / 3600);
				l %= 3600;
				p.textContent = `Today is ${r.toFixed(1)}% complete`;
				t.textContent = `${h} hours, ${Math.floor(l / 60)} minutes, and ${
					l % 60
				} seconds left today`;
				f = Math.round(r);
				for (i = 0; i < 100; i++) b.children[i].classList.toggle('l', i < f);
			}
			u();
			setInterval(u, 1e3);
		</script>
	</body>
</html>
